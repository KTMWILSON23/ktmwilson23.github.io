<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>XXFHen · Loading</title>
    <!-- This page carries its own styles and starts its own module, and it
         loads NOTHING else. That duplicates a little of style.css, and it is
         deliberate: every subresource is one more allocation and one more
         timing shift in the process that core.js is about to groom, and this
         exploit is decided by exactly that. The landing page may use the
         shared stylesheet; this one may not. -->
    <style>
      :root {
        --bg: #0a1016;
        --panel: #111c26;
        --sunk: #0d1720;
        --line: #2a3d4a;
        --fg: #d0dce2;
        --bright: #eff5f7;
        --dim: #a0b3bf;
        --faint: #859ba9;
        --ok: #a5f3cf;
        --bad: #f1a9a0;
        --warn: #ecd28f;
        --sans: "Segoe UI", system-ui, sans-serif;
        --mono: Consolas, "DejaVu Sans Mono", monospace;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--fg);
        font: 15px/1.45 var(--sans);
      }
      #brand {
        padding: 15px 24px;
        border-left: 4px solid var(--ok);
        border-bottom: 1px solid var(--line);
        background: var(--panel);
        text-align: left;
      }
      #brand b {
        color: var(--bright);
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.18em;
      }
      /* The live heap readout sits in the flow under the bar. Nothing here
         scrolls the document itself, so it stays in view without being
         positioned over the wordmark. */
      #ramBox {
        overflow: hidden;
        padding: 7px 28px;
        border-bottom: 1px solid var(--line);
        background: var(--sunk);
        color: var(--ok);
        font: 11px/1.4 var(--mono);
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      /* Running: a spinner under the bar. jb.js switches the body to .done,
         .fail or .log. */
      #spin {
        position: fixed;
        top: calc(50% + 20px);
        left: 50%;
        width: 46px;
        height: 46px;
        margin: -23px 0 0 -23px;
        border: 4px solid var(--line);
        border-top-color: var(--ok);
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      #msg {
        position: fixed;
        top: 50%;
        left: 0;
        right: 0;
        transform: translateY(-50%);
        display: none;
        text-align: center;
        padding: 0 24px;
        font-size: 18px;
        letter-spacing: 0.5px;
      }
      #state,
      #out {
        display: none;
      }
      body.done #spin,
      body.fail #spin {
        display: none;
      }
      body.fail #msg {
        display: block;
      }
      body.done #msg {
        display: block;
        color: var(--ok);
        font-weight: 700;
        letter-spacing: 2px;
      }
      /* ?log=1 -- the full step log. Laid out with flex rather than by
         subtracting a header height from 100vh. */
      body.log {
        display: flex;
        flex-direction: column;
        height: 100vh;
      }
      body.log #spin,
      body.log #msg {
        display: none;
      }
      body.log #wrap {
        display: flex;
        flex-direction: column;
        flex: 1;
        min-height: 0;
        padding: 20px 28px 32px;
      }
      body.log #state {
        display: block;
        margin: 0 0 12px;
        font-size: 22px;
        font-weight: 700;
      }
      body.log #out {
        display: block;
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        padding: 14px 16px;
        border: 1px solid var(--line);
        border-radius: 0;
        background: var(--sunk);
        font: 12px/1.55 var(--mono);
        white-space: pre-wrap;
      }
      /* The retry notice, raised by jb.js when the chain throws or stalls. */
      .notice {
        margin: 1em 0;
        padding: 0.7em 1em;
        border: 1px solid #f1a9a0;
        border-left-width: 4px;
        background: #291a1d;
        color: #ffd1ca;
        font: 700 20px/1.4 var(--sans);
      }
      .byline {
        position: fixed;
        bottom: 9px;
        left: 11px;
        margin: 0;
        color: var(--faint);
        font: 11px/1 var(--mono);
        letter-spacing: 0.06em;
      }
      .ok {
        color: var(--ok);
      }
      .bad {
        color: var(--bad);
      }
      .warn {
        color: var(--warn);
      }
      code {
        color: #b7d7e9;
      }
    </style>
  </head>
  <body>
    <!-- jb.js owns the body class: .log while the step log is shown, .done or
         .fail once the chain has settled. The ids below are its contract --
         #ramBox, #msg, #state and #out are read by name. -->
    <div id="brand"><b>XXFHen · PS4 14.00</b></div>
    <div id="ramBox">RAM: checking...</div>
    <div id="spin"></div>
    <div id="msg">Restart your console</div>
    <div id="wrap">
      <div id="state"></div>
      <div id="out"></div>
    </div>
    <p class="byline">by well0nez/m0zz</p>
    <script type="module">
      var target = /PlayStation\s+4[\/ ]14\.00(?:\b|[;)])/.test(navigator.userAgent || "");
      var activated = false;
      try {
        var stamp = Number(sessionStorage.getItem("xxfhen.activation"));
        activated = stamp > 0 && Date.now() >= stamp && Date.now() - stamp < 15 * 60 * 1000;
      } catch (error) {}
      if (target && activated) {
        import("./jb.js").catch(function () {
          document.body.className = "fail";
          document.getElementById("msg").textContent = "Loader files could not be opened. Return to the host and reload.";
        });
      } else {
        document.body.className = "fail";
        document.getElementById("msg").textContent = "Open the host on PS4 firmware 14.00 and select Start.";
        var back = document.createElement("a");
        back.href = "./";
        back.textContent = "Return to XXFHen";
        back.style.cssText = "display:block;margin-top:20px;color:#91d4aa;font-size:16px;text-decoration:underline";
        document.getElementById("msg").appendChild(back);
        document.getElementById("ramBox").textContent = "XXFHen · loader inactive";
      }
    </script>
  </body>
</html>
